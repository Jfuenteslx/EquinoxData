{% extends 'base.html' %}
{% block content %}

<div class="content-header">
    <div class="container-fluid">
        <h1 class="m-0 text-dark">Iniciar Sesion de Trabajo</h1>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Nueva sesion</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Evento asociado (opcional)</label>
                            <select name="evento_id" class="form-control">
                                <option value="">— Sin evento asociado —</option>
                                {% for evento in eventos %}
                                <option value="{{ evento.id }}">{{ evento.nombre }} — {{ evento.fecha }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">
                                Seleccionar el evento ayuda al analizador a generar casos historicos.
                            </small>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'ventas:sesiones_activas' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left mr-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-play mr-1"></i> Iniciar sesion
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
