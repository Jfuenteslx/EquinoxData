{% extends "base.html" %}
{% block content %}
<div class="content-header">
    <div class="container-fluid">
        <h1 class="m-0">Nuevo Resumen Semanal</h1>
    </div>
</div>
<section class="content">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card card-primary">
                    <div class="card-header"><h3 class="card-title">Seleccionar noches</h3></div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="card-body">
                            <div class="form-row">
                                <div class="col">
                                    <div class="form-group">
                                        <label>Nombre del resumen</label>
                                        <input type="text" name="nombre" class="form-control" placeholder="Semana del 12 al 14 de junio">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col">
                                    <div class="form-group">
                                        <label>Fecha inicio <span class="text-danger">*</span></label>
                                        <input type="date" name="fecha_inicio" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="form-group">
                                        <label>Fecha fin <span class="text-danger">*</span></label>
                                        <input type="date" name="fecha_fin" class="form-control" required>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Noches a incluir (cierres cerrados)</label>
                                {% if cierres %}
                                {% for c in cierres %}
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" class="custom-control-input" id="cierre_{{ c.pk }}" name="cierres" value="{{ c.pk }}">
                                    <label class="custom-control-label" for="cierre_{{ c.pk }}">
                                        {{ c.fecha|date:"d/m/Y" }}
                                        {% if c.evento %} — {{ c.evento.nombre }}{% endif %}
                                        (Ventas: {{ c.ingresos_ventas|floatformat:0 }} bs)
                                    </label>
                                </div>
                                {% endfor %}
                                {% else %}
                                <p class="text-muted">No hay cierres cerrados disponibles. Cerrá al menos una noche primero.</p>
                                {% endif %}
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Crear resumen</button>
                            <a href="{% url 'cuentas:lista_resumenes' %}" class="btn btn-secondary ml-2">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
